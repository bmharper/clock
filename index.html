<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#eee5d6">
  <meta name="description" content="Three ways to see the same moment. A tactile, sunlight-to-moonlight clock room.">
  <title>Clocks</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='10' fill='%232c3932'/%3E%3Ccircle cx='20' cy='20' r='14' fill='none' stroke='%23e8dfc9' stroke-width='2'/%3E%3Cpath d='M20 10v10l7 4' fill='none' stroke='%23e8dfc9' stroke-width='2'/%3E%3C/svg%3E">
  <style>
    :root {
      color-scheme: light;
      --room: #eee5d6; --room-top: #f7f1e7; --ink: #403d35; --muted: #7f7b6e;
      --line: #cfc7b8; --sun: 1; --night: 0; --dial: #f6f0df; --dial-ink: #343e35;
      --lume: #e9e5cc; --lume-glow: transparent; --metal: #bcb5a4; --metal-light: #f5edda;
      --case: #8b6247; --case-light: #bb9670; --case-dark: #59402f;
      --lcd: #d7ddba; --lcd-edge: #b2b99a; --digits: #354936; --digital-glow: transparent;
      --case24: #ccc7b8; --case24-light: #efebdf; --case24-dark: #9c988e;
      --lcd24: #d4ded1; --digits24: #354b43; --glow24: transparent;
    }
    * { box-sizing: border-box; }
    html { height: 100%; background: var(--room); }
    body {
      margin: 0; min-height: 100%; min-height: 100svh; overflow-x: hidden;
      color: var(--ink); font-family: "Helvetica Neue", Arial, sans-serif;
      background: radial-gradient(ellipse at 15% 0%, var(--room-top), transparent 75%), var(--room);
      -webkit-tap-highlight-color: transparent;
    }
    button { font: inherit; color: inherit; }
    button, [role="spinbutton"] { -webkit-user-select: none; user-select: none; }
    button:focus-visible, [role="spinbutton"]:focus-visible { outline: 2px solid var(--ink); outline-offset: 5px; }
    .room { max-width: 1400px; margin: auto; min-height: 100svh; padding: 20px 28px 12px; display: flex; flex-direction: column; }
    header { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 12px; }
    .hour-controls { grid-column: 2; display: flex; gap: 8px; }
    .hour-step { display: flex; align-items: center; justify-content: center; gap: 7px; min-width: 86px; min-height: 44px; padding: 9px 12px; border: 1px solid var(--line); border-radius: 99px; background: transparent; cursor: pointer; font-size: 11px; touch-action: manipulation; }
    .hour-step svg { width: 16px; height: 16px; }
    .hour-step:active { background: var(--line); }
    .now { grid-column: 3; justify-self: end; display: flex; align-items: center; gap: 10px; padding: 11px 15px; border: 1px solid var(--line); border-radius: 99px; background: transparent; cursor: pointer; font-size: 11px; white-space: nowrap; }
    .status-dot { width: 6px; height: 6px; border-radius: 50%; background: #71815d; box-shadow: 0 0 0 3px #71815d12; }
    body[data-live="false"] .status-dot { background: #b69a6a; }
    .reset-icon { width: 13px; height: 13px; margin-left: 5px; }
    .collection { display: grid; grid-template-columns: 1fr 1fr 1fr; align-items: start; align-content: center; gap: 3%; flex: 1; padding: 24px 0 12px; }
    .clock { min-width: 0; margin: 0; text-align: center; }
    .object-space { height: 400px; display: flex; align-items: center; justify-content: center; position: relative; }
    .object-space::after { content: ""; position: absolute; bottom: 10px; width: 85%; height: 19px; border-radius: 50%; background: #000; filter: blur(12px); opacity: calc(.08 + var(--sun) * .09); z-index: 0; }
    figcaption { margin-top: 10px; color: var(--muted); }
    .caption-title { display: block; font-size: 10px; font-weight: 600; letter-spacing: .21em; }
    .watch { width: 94%; max-width: 330px; aspect-ratio: 1; position: relative; z-index: 1; }
    .strap { position: absolute; width: 40%; height: 121%; left: 30%; top: -10.5%; border-radius: 18px; background: linear-gradient(90deg, #131a17, #38463b 13%, #29382e 50%, #3c4a3f 88%, #111b15); box-shadow: inset 0 0 0 2px #0004; filter: brightness(calc(.22 + var(--sun) * .78)); }
    .strap::after { content: ""; position: absolute; inset: 7px; border: 1px dashed #b9ab7766; border-radius: 12px; }
    .crown { position: absolute; width: 7%; height: 13%; right: -4%; top: 43.5%; border-radius: 3px; background: repeating-linear-gradient(0deg, var(--metal) 0 2px, var(--metal-light) 2px 3px); box-shadow: 2px 2px 5px #0003; }
    .bezel { position: absolute; inset: 0; border-radius: 50%; padding: 5.5%; background: conic-gradient(from 25deg, var(--metal), var(--metal-light) 15%, var(--metal) 28%, var(--metal-light) 48%, var(--metal) 62%, var(--metal-light) 78%, var(--metal)); box-shadow: 0 5px 9px #0004, inset 0 0 0 1px #ffffff25; }
    .dial { position: relative; width: 100%; height: 100%; border-radius: 50%; overflow: hidden; background: radial-gradient(ellipse at 30% 20%, var(--dial), var(--dial) 60%, var(--dial-outer, var(--dial))); box-shadow: 0 0 0 2px var(--metal), inset 0 2px 6px #0003; }
    .watch-face { width: 100%; height: 100%; overflow: visible; }
    .minute-mark { stroke: var(--dial-ink); stroke-width: .65; opacity: .55; }
    .hour-mark { fill: var(--lume); stroke: var(--dial-ink); stroke-width: .6; filter: drop-shadow(0 0 2px var(--lume-glow)); }
    .dial-number { fill: var(--dial-ink); font-family: Georgia, serif; font-size: 15px; text-anchor: middle; dominant-baseline: middle; }
    .brand { fill: var(--dial-ink); font-size: 6px; letter-spacing: 2px; text-anchor: middle; }
    .watch-subtitle { fill: var(--dial-ink); font-size: 3.7px; letter-spacing: 1.1px; text-anchor: middle; }
    .inset-box { fill: var(--inset, #e7e2d2); stroke: var(--metal); stroke-width: .7; }
    .inset-text { fill: var(--dial-ink); font-size: 12px; font-weight: 600; letter-spacing: 1px; text-anchor: middle; }
    .hand { fill: var(--dial-ink); filter: drop-shadow(0 1px 1px #0004); }
    .hand-lume { fill: var(--lume); filter: drop-shadow(0 0 2px var(--lume-glow)); }
    .second-hand { stroke: var(--second, #997746); stroke-width: .75; }
    .pin { fill: var(--metal-light); stroke: var(--dial-ink); stroke-width: 1; }
    .glass { position: absolute; inset: 0; border-radius: 50%; pointer-events: none; background: linear-gradient(130deg, #fff5, #fff0 45%); opacity: calc(var(--dial-reflection, var(--sun)) * .45); }
    .bedside { width: 100%; position: relative; z-index: 1; padding: 10px; border-radius: 20px; background: linear-gradient(145deg, var(--case-light), var(--case) 32%, var(--case-dark)); border: 1px solid #ffffff16; box-shadow: inset 0 2px 1px #ffffff40, inset 0 -3px 2px #0003, 0 12px 16px -10px #0007; }
    .bedside::before { content: ""; position: absolute; left: 34%; top: -5px; width: 32%; height: 7px; border-radius: 4px 4px 0 0; background: var(--case-light); box-shadow: inset 0 1px #ffffff25; z-index: -1; }
    .bedside.cool { --case: var(--case24); --case-light: var(--case24-light); --case-dark: var(--case24-dark); --lcd: var(--lcd24); --digits: var(--digits24); --digital-glow: var(--glow24); --screen-reflection: var(--reflection24); }
    .screen { position: relative; padding: 4px 3px 3px; border-radius: 12px; background: var(--lcd); color: var(--digits); box-shadow: 0 1px 1px #ffffff36, 0 0 0 3px #00000012, inset 0 3px 8px #0003; }
    .screen::after { content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none; background: linear-gradient(145deg, #fff6, transparent 50%); opacity: calc(var(--screen-reflection, var(--sun)) * .4); }
    .display { display: flex; align-items: center; justify-content: center; gap: 1%; }
    .wheel { position: relative; width: 45%; aspect-ratio: 74 / 68; overflow: hidden; cursor: ns-resize; touch-action: none; border-radius: 4px; }
    .wheel:focus-visible { outline-color: var(--digits); outline-offset: 0; }
    .reel { position: absolute; width: 100%; height: 100%; will-change: transform; }
    .reel > svg { position: absolute; left: 0; top: 0; width: 100%; height: 100%; padding: 2px 0; overflow: visible; filter: drop-shadow(0 0 2px var(--digital-glow)); }
    .reel > svg:nth-child(1) { top: -100%; }
    .reel > svg:nth-child(3) { top: 100%; }
    .segment.off { opacity: .055; }
    .segment.on { opacity: 1; }
    .colon { width: 6%; height: 35px; display: flex; flex-direction: column; justify-content: space-between; align-items: center; filter: drop-shadow(0 0 4px var(--digital-glow)); }
    .colon::before, .colon::after { content: ""; width: 5px; height: 5px; border-radius: 1px; background: currentColor; }
    .screen-bottom { min-height: 38px; display: flex; align-items: center; justify-content: space-between; padding: 0 3px; }
    .periods { display: flex; gap: 3px; }
    .period { display: flex; align-items: center; gap: 5px; border: 0; padding: 8px 6px; min-height: 38px; background: none; color: inherit; font-size: 14px; font-weight: 600; letter-spacing: .04em; cursor: pointer; opacity: .35; }
    .period::before { content: ""; width: 5px; height: 5px; background: currentColor; border-radius: 50%; }
    .period[aria-pressed="true"] { opacity: 1; text-shadow: 0 0 5px var(--digital-glow); }
    .period[aria-pressed="true"]::before { box-shadow: 0 0 5px var(--digital-glow); }
    .screen-note { font-size: 7px; letter-spacing: .13em; }
    .seconds { font-family: ui-monospace, "Courier New", monospace; font-size: 11px; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
    @media (max-width: 900px) {
      .room { padding: 16px 20px 12px; }
      .collection { padding: 20px 0 10px; }
      .object-space { height: 280px; }
      .bedside { padding: 8px; border-radius: 17px; }
      .screen { padding: 3px; border-radius: 9px; }
      figcaption { margin-top: 10px; }
      .period { font-size: 13px; }
    }
    @media (orientation: landscape) and (max-height: 560px) {
      .room { padding: max(12px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(10px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left)); }
      .now { padding: 9px 12px; font-size: 10px; }
      .collection { padding: 18px 0 8px; }
      .object-space { height: min(66svh, 380px); }
      .watch { width: min(94%, 55svh); }
      .object-space::after { bottom: 0; }
      figcaption { margin-top: 10px; }
      .caption-title { font-size: 8px; }
    }
    @media (orientation: landscape) and (max-height: 350px) {
      .room { padding-top: 10px; padding-bottom: 8px; }
      .collection { padding: 12px 0 6px; }
      .object-space { height: 65svh; }
    }
    @media (orientation: portrait) {
      .room { padding: 16px 18px; }
      .collection { grid-template-columns: 1fr; justify-items: center; gap: 24px; padding: 22px 0 12px; }
      .clock { width: min(100%, clamp(240px, 70vw, 340px)); }
      .clock:first-child .object-space { padding: calc(min(58vw, 24svh, 240px) * .11) 0; }
      .watch { width: min(58vw, 24svh, 240px); }
      .object-space { height: auto; }
      .object-space::after { bottom: 0; }
      .bedside { padding: 7px; }
      .screen { padding: 3px; }
    }
    @media (orientation: portrait) and (max-width: 600px) {
      header { row-gap: 8px; }
      .now { grid-column: 2; justify-self: center; padding: 9px; font-size: 10px; gap: 7px; }
    }
    @media (prefers-reduced-motion: reduce) { .reel { will-change: auto; } }
  </style>
  <script src="clock.js" defer></script>
</head>
<body data-live="true">
  <div class="room">
    <header>
      <div class="hour-controls" role="group" aria-label="Adjust all clocks by one hour">
        <button class="hour-step" id="hour-back" aria-label="Back one hour" title="Move all clocks back one hour">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="m14 6-6 6 6 6"/></svg><span>−1 hour</span>
        </button>
        <button class="hour-step" id="hour-forward" aria-label="Forward one hour" title="Move all clocks forward one hour">
          <span>+1 hour</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="m10 6 6 6-6 6"/></svg>
        </button>
      </div>
      <button class="now" id="now" title="Return all clocks to the current local time" aria-label="Return to current local time">
        <span class="status-dot" aria-hidden="true"></span><span id="mode">Live local time</span>
        <svg class="reset-icon" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><path d="M4 7a7 7 0 1 1-1 6M4 2v5h5"/></svg>
      </button>
    </header>
    <main class="collection" aria-label="Three synchronized clocks">
      <figure class="clock">
        <div class="object-space">
          <div class="watch" role="img" id="analog" aria-label="Analog clock">
            <div class="strap"></div><div class="crown"></div>
            <div class="bezel"><div class="dial">
              <svg class="watch-face" viewBox="0 0 200 200" aria-hidden="true">
                <g id="markers"></g>
                <text x="100" y="35" class="dial-number">12</text><text x="165" y="101" class="dial-number">3</text>
                <text x="100" y="168" class="dial-number">6</text><text x="35" y="101" class="dial-number">9</text>
                <text x="101" y="62" class="brand">MOMENT</text><text x="100" y="72" class="watch-subtitle">EVERY SECOND, TOGETHER</text>
                <rect x="80" y="125" width="40" height="22" rx="2" class="inset-box"/><text x="100" y="140" class="inset-text" id="analog-period">AM</text>
                <g id="hour-hand"><path class="hand" d="M96 112 95 66 100 49 105 66 104 112Z"/><path class="hand-lume" d="M98 94 98 66 100 57 102 66 102 94Z"/></g>
                <g id="minute-hand"><path class="hand" d="M97 115 97 40 100 20 103 40 103 115Z"/><path class="hand-lume" d="M99 92 99 41 100 31 101 41 101 92Z"/></g>
                <g id="second-hand"><path class="second-hand" d="M100 120V19"/><circle cx="100" cy="116" r="2.5" fill="var(--second, #997746)"/></g>
                <circle cx="100" cy="100" r="3.4" class="pin"/>
              </svg><div class="glass"></div>
            </div></div>
          </div>
        </div>
      </figure>
      <figure class="clock">
        <div class="object-space">
          <div class="bedside">
            <div class="screen">
              <div class="display">
                <div class="wheel" id="hours12" data-unit="hours" data-format="12" role="spinbutton" tabindex="0" aria-label="12-hour clock hours" aria-valuemin="1" aria-valuemax="12" aria-describedby="controls-help"><div class="reel" aria-hidden="true"></div></div>
                <div class="colon" aria-hidden="true"></div>
                <div class="wheel" id="minutes12" data-unit="minutes" data-format="12" role="spinbutton" tabindex="0" aria-label="12-hour clock minutes" aria-valuemin="0" aria-valuemax="59" aria-describedby="controls-help"><div class="reel" aria-hidden="true"></div></div>
              </div>
              <div class="screen-bottom"><div class="periods"><button class="period" id="am" aria-label="AM, toggle AM or PM" aria-pressed="true">AM</button><button class="period" id="pm" aria-label="PM, toggle AM or PM" aria-pressed="false">PM</button></div><span class="seconds" aria-hidden="true">:00</span></div>
            </div>
          </div>
        </div>
        <figcaption><span class="caption-title">12-hour</span></figcaption>
      </figure>
      <figure class="clock">
        <div class="object-space">
          <div class="bedside cool">
            <div class="screen">
              <div class="display">
                <div class="wheel" id="hours24" data-unit="hours" data-format="24" role="spinbutton" tabindex="0" aria-label="24-hour clock hours" aria-valuemin="0" aria-valuemax="23" aria-describedby="controls-help"><div class="reel" aria-hidden="true"></div></div>
                <div class="colon" aria-hidden="true"></div>
                <div class="wheel" id="minutes24" data-unit="minutes" data-format="24" role="spinbutton" tabindex="0" aria-label="24-hour clock minutes" aria-valuemin="0" aria-valuemax="59" aria-describedby="controls-help"><div class="reel" aria-hidden="true"></div></div>
              </div>
              <div class="screen-bottom"><span class="screen-note">24 HOUR TIME</span><span class="seconds" aria-hidden="true">:00</span></div>
            </div>
          </div>
        </div>
        <figcaption><span class="caption-title">24-hour</span></figcaption>
      </figure>
    </main>
    <p class="sr-only" id="controls-help">Swipe up to increase or down to decrease. You can also scroll, or use the up and down arrow keys. Changing the time pauses all clocks. Use the current time button to resume.</p>
    <p class="sr-only" id="announcement" role="status" aria-live="polite"></p>
  </div>
</body>
</html>
